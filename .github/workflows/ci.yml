name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=high
      # Use Google's public Docker Hub mirror to avoid shared-runner pull limits.
      - name: Build Docker image
        run: >-
          docker build
          --build-arg NODE_IMAGE=mirror.gcr.io/library/node:22-alpine
          --build-arg NGINX_IMAGE=mirror.gcr.io/library/nginx:1.27-alpine
          -t rodobach-front:test .
